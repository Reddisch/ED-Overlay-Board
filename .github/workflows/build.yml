name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: |
          cmake --version
          cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package (app + OpenXR layer)
        run: |
          cmake --install build --config Release --prefix dist/EDOverlayBoard
          Compress-Archive -Path dist/EDOverlayBoard -DestinationPath EDOverlayBoard.zip

      - name: Installer (Inno Setup)
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(EDOverlayBoard VERSION ([0-9.]+)').Groups[1].Value
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\dist\EDOverlayBoard" installer\EDOverlayBoard.iss
          if ($LASTEXITCODE) { exit 1 }
          Copy-Item "dist\EDOverlayBoard-Setup-$version.exe" EDOverlayBoard-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: EDOverlayBoard
          path: |
            EDOverlayBoard.zip
            EDOverlayBoard-Setup.exe

      # The release description comes from release-notes.md (German + English, written for each
      # release). It must name the tag's version, so old notes never end up on a new release.
      - name: Check release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if (-not (Select-String -Path release-notes.md -SimpleMatch $version -Quiet)) {
            Write-Error "release-notes.md does not mention version $version - update it before tagging"
            exit 1
          }

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            EDOverlayBoard.zip
            dist/EDOverlayBoard-Setup-*.exe
