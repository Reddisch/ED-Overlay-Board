name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package (app + OpenXR layer)
        run: |
          cmake --install build --config Release --prefix dist/EDOverlayBoard
          Compress-Archive -Path dist/EDOverlayBoard -DestinationPath EDOverlayBoard.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EDOverlayBoard
          path: EDOverlayBoard.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EDOverlayBoard.zip
