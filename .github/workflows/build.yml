name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package (app + OpenXR layer)
        run: |
          cmake --install build --config Release --prefix dist/EDOverlayBoard
          Compress-Archive -Path dist/EDOverlayBoard -DestinationPath EDOverlayBoard.zip

      - name: Installer (Inno Setup)
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(EDOverlayBoard VERSION ([0-9.]+)').Groups[1].Value
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\dist\EDOverlayBoard" installer\EDOverlayBoard.iss
          if ($LASTEXITCODE) { exit 1 }
          Copy-Item "dist\EDOverlayBoard-Setup-$version.exe" EDOverlayBoard-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: EDOverlayBoard
          path: |
            EDOverlayBoard.zip
            EDOverlayBoard-Setup.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EDOverlayBoard.zip
            dist/EDOverlayBoard-Setup-*.exe
